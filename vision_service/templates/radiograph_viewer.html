<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dental AI — Radyografik Görüntü</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#f4f7fb;background:#020304}*{box-sizing:border-box}html,body{margin:0;background:#020304;min-height:100%}.app{max-width:980px;margin:auto;padding:0;background:#020304;min-height:100vh}.top{display:none}.error{display:none;background:#421c22;color:#ffd7db;padding:10px;margin:8px;border-radius:12px}.viewer{position:relative;background:#020304;overflow:hidden;min-height:0;display:flex;align-items:center;justify-content:center}.viewer img{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain}.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.filters,.legend{display:none!important}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#0b1220;border:1px solid #263247;border-bottom:0;border-radius:24px 24px 0 0;padding:8px 8px 0;margin:0 10px}.tab{border:0;border-radius:16px 16px 0 0;padding:15px 6px;background:transparent;color:#aeb8c8;font-weight:850;font-size:15px}.tab.active{background:#263d64;color:#fff;border-bottom:3px solid #69a9ff}.panel{display:grid;gap:10px;padding:14px;margin:0 10px;background:#0b1220;border:1px solid #263247;border-top:0;border-radius:0 0 24px 24px;min-height:245px}.card{padding:15px;background:#0e1727;border:1px solid #2b3850;border-radius:17px;cursor:pointer;transition:.18s}.card.selected{border-color:#30dc7d;box-shadow:0 0 0 2px rgba(48,220,125,.16)}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.title{font-weight:850;font-size:16px;color:#fff}.badge{font-size:11px;font-weight:800;background:#18243a;color:#cbd5e4;border-radius:999px;padding:5px 8px}.sub,.note{font-size:12px;color:#8f9bad;margin-top:5px;line-height:1.45}.description{margin-top:8px;font-size:13px;line-height:1.45;color:#b7c1d0}.actions{display:none}.empty{padding:24px;text-align:center;color:#8f9bad;background:#0e1727;border-radius:14px}@media(max-width:600px){.viewer img{max-height:58vh}.tabs,.panel{margin-left:0;margin-right:0}}
</style></head><body><main class="app"><div id="error" class="error"></div><section class="viewer"><img id="photo" alt="Radyografik görüntü"><canvas id="overlay" class="overlay"></canvas></section><div id="filters" class="filters"></div><div class="legend">Yalnız motorun gerçek lokalizasyonu gösterilir. Lokalizasyon yoksa bulgu listede kalır.</div><nav class="tabs"><button class="tab active" data-tab="findings">Bulgular</button><button class="tab" data-tab="treatments">Tedavi</button><button class="tab" data-tab="chart">Klinik Bilgi</button></nav><section id="panel" class="panel"></section></main><script src="/radiograph-viewer.js"></script></body></html>
