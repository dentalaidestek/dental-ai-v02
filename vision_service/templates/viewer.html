<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dental AI — Vision48 Geliştirme Kontrolü</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#171717;background:#f4f5f7}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px #0000000a}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,.8fr);gap:14px}.viewer{position:relative;background:#050505;border-radius:14px;overflow:hidden;min-height:280px}.viewer img{display:block;width:100%;height:auto}.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.box{fill:transparent;stroke:#21e6c1;stroke-width:3;vector-effect:non-scaling-stroke}.box.active{stroke:#fff200;stroke-width:5}.item{border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:7px 0;cursor:pointer}.item:hover,.item.active{border-color:#111;background:#f8fafc}.muted{color:#6b7280;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}button,input{font:inherit}button{border:0;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer;background:#111;color:white}input[type=file],input[type=password]{border:1px solid #d1d5db;border-radius:10px;padding:10px;background:white;max-width:100%}.tabs button{background:#e5e7eb;color:#111}.tabs button.active{background:#111;color:white}.hidden{display:none}.status{white-space:pre-wrap}.three{height:520px;background:#080b10;border-radius:14px;overflow:hidden}.pill{display:inline-block;background:#eef2ff;border-radius:999px;padding:5px 9px;font-size:12px;margin:2px}@media(max-width:780px){.grid{grid-template-columns:1fr}.three{height:420px}}
</style>
</head>
<body><div class="wrap">
<div class="card"><h1 style="margin:0 0 6px">Dental AI geliştirme kontrol ekranı</h1><div class="muted">Production değildir. Panoramik bulgular ve fotoğraftan 3D sunum katmanı burada kontrol edilir.</div></div>
<div class="card tabs row"><button id="tabPano" class="active" onclick="tab('pano')">Panoramik AI</button><button id="tab3d" onclick="tab('photo3d')">Fotoğraftan 3D</button></div>
<section id="pano">
<div class="card row"><input id="key" type="password" placeholder="Vision API anahtarı"><input id="panoFile" type="file" accept="image/*"><button onclick="analyzePano()">Analiz et</button><span id="panoStatus" class="muted"></span></div>
<div class="grid"><div class="card"><div class="viewer" id="viewer"><img id="panoImg"><svg id="overlay" class="overlay"></svg></div></div><div class="card"><h2 style="margin-top:0">AI Tespitleri</h2><div id="findingMeta" class="muted">Bir panoramik seçin.</div><div id="findings"></div></div></div>
</section>
<section id="photo3d" class="hidden">
<div class="card"><div class="row"><input id="photoFiles" type="file" accept="image/*" multiple><button onclick="make3d()">3D görselleştirme oluştur</button></div><p class="muted">Tek fotoğrafta yüzey-relief; çok açılı fotoğraflarda mümkün olduğunda sparse SfM nokta bulutu. CBCT/medikal hacim değildir.</p><div id="photoStatus" class="status muted"></div></div>
<div class="card"><div id="three" class="three"></div></div>
</section>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/controls/OrbitControls.js';
window.THREE=THREE;window.OrbitControls=OrbitControls;
</script>
<script>
function tab(which){document.getElementById('pano').classList.toggle('hidden',which!=='pano');document.getElementById('photo3d').classList.toggle('hidden',which!=='photo3d');document.getElementById('tabPano').classList.toggle('active',which==='pano');document.getElementById('tab3d').classList.toggle('active',which==='photo3d')}
let lastResult=null;function key(){return document.getElementById('key').value}
async function analyzePano(){const f=document.getElementById('panoFile').files[0];if(!f)return;const img=document.getElementById('panoImg');img.src=URL.createObjectURL(f);document.getElementById('panoStatus').textContent='Analiz ediliyor…';const fd=new FormData();fd.append('image',f);const r=await fetch('/analyze',{method:'POST',headers:{'X-Vision-Key':key()},body:fd});if(!r.ok){document.getElementById('panoStatus').textContent='Hata: '+await r.text();return}lastResult=await r.json();document.getElementById('panoStatus').textContent=lastResult.finding_count+' tespit';img.onload=()=>draw();if(img.complete)draw()}
function draw(active=-1){if(!lastResult)return;const img=document.getElementById('panoImg'),svg=document.getElementById('overlay');const naturalW=img.naturalWidth||1,naturalH=img.naturalHeight||1;svg.setAttribute('viewBox',`0 0 ${naturalW} ${naturalH}`);svg.innerHTML='';const list=document.getElementById('findings');list.innerHTML='';document.getElementById('findingMeta').textContent=`${lastResult.unique_fdi_count||0} FDI diş • ${lastResult.finding_count||0} bulgu`;lastResult.findings.forEach((x,i)=>{if(x.bbox&&x.bbox.length===4){const [x1,y1,x2,y2]=x.bbox;const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');rect.setAttribute('x',x1);rect.setAttribute('y',y1);rect.setAttribute('width',x2-x1);rect.setAttribute('height',y2-y1);rect.setAttribute('class','box'+(i===active?' active':''));svg.appendChild(rect)}const el=document.createElement('div');el.className='item'+(i===active?' active':'');el.innerHTML=`<strong>${x.fdi?'FDI '+x.fdi+' — ':''}${x.label||x.finding_code}</strong><div class="muted">${x.finding_code} • skor ${Math.round((x.confidence||0)*100)}% • ${x.evidence_type||'direct'}</div>`;el.onclick=()=>draw(i);list.appendChild(el)})}
async function make3d(){const fs=[...document.getElementById('photoFiles').files];if(!fs.length)return;const status=document.getElementById('photoStatus');status.textContent='3D görselleştirme hazırlanıyor…';const fd=new FormData();fs.forEach(f=>fd.append('images',f));const r=await fetch('/photo3d/reconstruct',{method:'POST',headers:{'X-Vision-Key':key()},body:fd});if(!r.ok){status.textContent='Hata: '+await r.text();return}const data=await r.json();status.textContent=`${data.label}\nMod: ${data.mode} • ${data.point_count} nokta\n${data.warning}`;render3d(data)}
function render3d(data){if(!window.THREE){setTimeout(()=>render3d(data),200);return}const THREE=window.THREE,host=document.getElementById('three');host.innerHTML='';const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,host.clientWidth/host.clientHeight,.01,100);camera.position.set(0,0,2.4);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth,host.clientHeight);host.appendChild(renderer.domElement);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(data.points.flat(),3));g.setAttribute('color',new THREE.Float32BufferAttribute(data.colors.flat().map(v=>v/255),3));const m=new THREE.PointsMaterial({size:.012,vertexColors:true});scene.add(new THREE.Points(g,m));const c=new window.OrbitControls(camera,renderer.domElement);c.enableDamping=true;function loop(){requestAnimationFrame(loop);c.update();renderer.render(scene,camera)}loop();new ResizeObserver(()=>{camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)}).observe(host)}
</script></body></html>
