<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dental AI — 3D Anatomik Görünüm</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#020304}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020304}html.embedded .top{display:none!important}html.embedded .badge{top:12px}html.embedded .pano-mini{top:12px}.app{min-height:100vh;background:radial-gradient(circle at 50% 18%,#14213a 0,#080b12 42%,#020304 76%)}.top{position:fixed;z-index:20;left:0;right:0;top:0;display:flex;gap:8px;padding:10px 12px;background:linear-gradient(#06080ded,#06080dba,transparent)}.top input{min-width:0;border:1px solid #313845;border-radius:12px;padding:10px;background:#fff;color:#111}.top input[type=password]{width:170px}.top input[type=file]{flex:1}.btn{border:0;border-radius:12px;padding:11px 15px;background:#fff;color:#111;font-weight:850;cursor:pointer}.stage{position:relative;height:100vh;min-height:620px;overflow:hidden}.three{position:absolute;inset:0;transition:bottom .22s ease}.stage.has-results #jaw3d{bottom:min(39vh,360px)}.badge{position:absolute;left:12px;top:72px;z-index:9;padding:7px 10px;border:1px solid #263041;border-radius:999px;background:#090d15cc;color:#dbe4f2;font-size:12px;backdrop-filter:blur(8px);max-width:calc(100vw - 24px)}.hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;padding:7px 10px;border:1px solid #263041;border-radius:999px;background:#090d15cc;color:#cdd6e4;font-size:10px;white-space:nowrap}.stage.has-results .hint{display:none}.pano-mini{position:absolute;z-index:8;right:12px;top:72px;width:min(38vw,360px);border:1px solid #222b39;border-radius:14px;padding:6px;background:#070a0fcb;backdrop-filter:blur(8px)}.pano-mini img{display:block;width:100%;border-radius:9px}.pano-mini.hidden{display:none}.analysis-sheet{position:absolute;z-index:14;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom));height:min(36vh,330px);max-width:860px;margin:0 auto;border:1px solid #293346;border-radius:22px;background:linear-gradient(180deg,#111827f2,#080d15f5);box-shadow:0 18px 60px #0009;backdrop-filter:blur(18px);overflow:hidden}.analysis-sheet.hidden{display:none}.sheet-handle{width:54px;height:5px;border-radius:99px;background:#7d8ba6;margin:8px auto 5px;opacity:.8}.sheet-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 8px 7px;border-bottom:1px solid #263043}.sheet-tab{min-width:0;border:0;border-radius:12px;padding:10px 6px;background:transparent;color:#aeb9cd;font-weight:800;font-size:13px;cursor:pointer}.sheet-tab.active{background:#25395d;color:#fff;box-shadow:inset 0 -2px 0 #69a4ff}.sheet-count{font-size:10px;opacity:.75}.sheet-body{height:calc(100% - 66px);overflow:auto;padding:10px 10px 14px;overscroll-behavior:contain}.sheet-note{font-size:11px;color:#9eabc0;margin:0 2px 8px}.finding-list{display:grid;gap:8px}.finding-card{width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid #2c374a;border-radius:14px;padding:10px 11px;background:#111824;color:#fff;cursor:pointer}.finding-card:active{transform:scale(.995)}.finding-main{min-width:0}.finding-title{font-weight:850;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.finding-sub{margin-top:3px;color:#9eabc0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.finding-score{display:none}.empty-card{border:1px dashed #344157;border-radius:14px;padding:16px;color:#aeb9cd;text-align:center;font-size:12px}.view-list{display:grid;gap:8px}.view-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid #2c374a;border-radius:14px;padding:11px 12px;background:#111824;color:#fff;font-weight:750}.view-toggle span:last-child{color:#8fb8ff;font-size:11px}.detail{position:fixed;inset:0;z-index:40;background:#020304;display:none}.detail.open{display:block}.detail-top{position:absolute;z-index:48;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px;background:linear-gradient(#06080df5,#06080db7,transparent)}.detail-title{font-weight:900;font-size:20px}.close{border:1px solid #303947;border-radius:12px;background:#111722;color:#fff;padding:9px 12px;font-weight:800}.detail #tooth3d{position:absolute;inset:0 0 min(39vh,350px) 0}.tooth-sheet{position:absolute;z-index:46;left:10px;right:10px;bottom:max(8px,env(safe-area-inset-bottom));height:min(38vh,340px);border:1px solid #293346;border-radius:22px;background:linear-gradient(180deg,#111827f5,#080d15f8);box-shadow:0 18px 60px #0009;backdrop-filter:blur(18px);overflow:hidden}.tooth-sheet .sheet-body{height:calc(100% - 58px)}.treatment-box{display:grid;gap:9px}.analysis-action{width:100%;border:0;border-radius:13px;padding:12px;background:#fff;color:#111;font-weight:900}.analysis-action:disabled{opacity:.5}.treatment-result{display:grid;gap:8px}.result-block{border:1px solid #2c374a;border-radius:14px;padding:11px;background:#111824}.result-block b{display:block;margin-bottom:5px}.detail-info{display:none;position:absolute;z-index:8;left:12px;right:12px;bottom:14px;grid-template-columns:112px 1fr;gap:10px;padding:9px;border:1px solid #253041;border-radius:16px;background:#080c13d9;backdrop-filter:blur(10px)}.detail-info canvas{width:112px;height:112px;object-fit:cover;border-radius:11px;background:#000}.chips{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}.chip{padding:6px 8px;border-radius:999px;border:1px solid #303a4a;background:#151c27;color:#e6edf7;font-size:11px}.metric{margin-top:7px;color:#9aa8ba;font-size:10px;line-height:1.35}.error{position:fixed;z-index:60;left:12px;right:12px;top:72px;display:none;padding:10px;border:1px solid #8d3030;border-radius:12px;background:#5b1c1c;color:#fff}@media(max-width:620px){.top{flex-wrap:wrap}.top input[type=password]{width:100%;flex-basis:100%}.pano-mini{width:42vw;top:124px}.badge{top:124px;font-size:11px}.analysis-sheet{left:8px;right:8px;height:min(38vh,340px);border-radius:20px}.stage.has-results #jaw3d{bottom:min(41vh,365px)}.detail-info{grid-template-columns:92px 1fr}.detail-info canvas{width:92px;height:92px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script>
</head>
<body>
<script>if(new URLSearchParams(location.search).get("embedded")==="1")document.documentElement.classList.add("embedded");</script>
<div class="app">
  <div class="top"><input id="key" type="password" placeholder="Güvenlik anahtarı"><input id="file" type="file" accept="image/*"><button id="run" class="btn">3D oluştur</button></div>
  <div id="stage" class="stage">
    <div id="jaw3d" class="three"></div>
    <div id="status" class="badge">Panoramik seçin</div>
    <div id="panoMini" class="pano-mini hidden"><img id="panoImg"></div>
    <div class="hint">Sürükle: döndür • Sıkıştır: yakınlaştır • Dişe dokun: ayrıntı</div>
    <section id="analysisSheet" class="analysis-sheet hidden" aria-label="3D analiz sonuçları">
      <div class="sheet-handle"></div>
      <div class="sheet-tabs">
        <button class="sheet-tab active" data-sheet-tab="findings">Bulgular <span id="findingsCount" class="sheet-count"></span></button>
        <button class="sheet-tab" data-sheet-tab="treatments">Tedavi</button>
        <button class="sheet-tab" data-sheet-tab="view">Görünüm</button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
    </section>
  </div>
</div>
<div id="detail" class="detail">
  <div class="detail-top"><div id="detailTitle" class="detail-title">Diş</div><button id="close" class="close">Geri</button></div>
  <div id="tooth3d" class="three"></div>
  <section class="tooth-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-tabs">
      <button class="sheet-tab active" data-tooth-tab="findings">Bulgular</button>
      <button class="sheet-tab" data-tooth-tab="treatments">Tedavi</button>
      <button class="sheet-tab" data-tooth-tab="view">Görünüm</button>
    </div>
    <div id="toothSheetBody" class="sheet-body"></div>
  </section>
  <div class="detail-info"><canvas id="crop"></canvas><div><div id="chips" class="chips"></div><div id="metrics" class="metric"></div></div></div>
</div>
<div id="error" class="error"></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
window.D3={THREE,OrbitControls,OBJLoader};window.dispatchEvent(new Event('d3-ready'));
</script>
<script src="/viewer-v3.js"></script>
<script src="/viewer-v3-finalfix.js"></script>
<script src="/viewer-v3-postfix.js"></script>
</body>
</html>
