<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dental AI — 3D Anatomik Görünüm</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#020304}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020304}.app{min-height:100vh;background:radial-gradient(circle at 50% 18%,#14213a 0,#080b12 42%,#020304 76%)}.top{position:fixed;z-index:20;left:0;right:0;top:0;display:flex;gap:8px;padding:10px 12px;background:linear-gradient(#06080ded,#06080dba,transparent)}.top input{min-width:0;border:1px solid #313845;border-radius:12px;padding:10px;background:#fff;color:#111}.top input[type=password]{width:170px}.top input[type=file]{flex:1}.btn{border:0;border-radius:12px;padding:11px 15px;background:#fff;color:#111;font-weight:850;cursor:pointer}.stage{position:relative;height:100vh;min-height:620px}.three{position:absolute;inset:0}.badge{position:absolute;left:12px;top:72px;z-index:9;padding:7px 10px;border:1px solid #263041;border-radius:999px;background:#090d15cc;color:#dbe4f2;font-size:12px;backdrop-filter:blur(8px)}.hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;padding:7px 10px;border:1px solid #263041;border-radius:999px;background:#090d15cc;color:#cdd6e4;font-size:10px;white-space:nowrap}.pano-mini{position:absolute;z-index:8;right:12px;top:72px;width:min(38vw,360px);border:1px solid #222b39;border-radius:14px;padding:6px;background:#070a0fcb;backdrop-filter:blur(8px)}.pano-mini img{display:block;width:100%;border-radius:9px}.pano-mini.hidden{display:none}.detail{position:fixed;inset:0;z-index:40;background:#020304;display:none}.detail.open{display:block}.detail-top{position:absolute;z-index:8;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px;background:linear-gradient(#06080df5,#06080db7,transparent)}.detail-title{font-weight:900;font-size:20px}.close{border:1px solid #303947;border-radius:12px;background:#111722;color:#fff;padding:9px 12px;font-weight:800}.detail-info{position:absolute;z-index:8;left:12px;right:12px;bottom:14px;display:grid;grid-template-columns:112px 1fr;gap:10px;padding:9px;border:1px solid #253041;border-radius:16px;background:#080c13d9;backdrop-filter:blur(10px)}.detail-info canvas{width:112px;height:112px;object-fit:cover;border-radius:11px;background:#000}.chips{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}.chip{padding:6px 8px;border-radius:999px;border:1px solid #303a4a;background:#151c27;color:#e6edf7;font-size:11px}.metric{margin-top:7px;color:#9aa8ba;font-size:10px;line-height:1.35}.error{position:fixed;z-index:60;left:12px;right:12px;top:72px;display:none;padding:10px;border:1px solid #8d3030;border-radius:12px;background:#5b1c1c;color:#fff}@media(max-width:620px){.top{flex-wrap:wrap}.top input[type=password]{width:100%;flex-basis:100%}.pano-mini{width:46vw;top:124px}.badge{top:124px}.detail-info{grid-template-columns:92px 1fr}.detail-info canvas{width:92px;height:92px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script>
</head>
<body>
<div class="app">
  <div class="top"><input id="key" type="password" placeholder="Güvenlik anahtarı"><input id="file" type="file" accept="image/*"><button id="run" class="btn">3D oluştur</button></div>
  <div class="stage"><div id="jaw3d" class="three"></div><div id="status" class="badge">Panoramik seçin</div><div id="panoMini" class="pano-mini hidden"><img id="panoImg"></div><div class="hint">Sürükle: döndür • Sıkıştır: yakınlaştır • Dişe dokun: ayrıntı</div></div>
</div>
<div id="detail" class="detail"><div class="detail-top"><div id="detailTitle" class="detail-title">Diş</div><button id="close" class="close">Kapat</button></div><div id="tooth3d" class="three"></div><div class="detail-info"><canvas id="crop"></canvas><div><div id="chips" class="chips"></div><div id="metrics" class="metric"></div></div></div></div>
<div id="error" class="error"></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
window.D3={THREE,OrbitControls,OBJLoader};window.dispatchEvent(new Event('d3-ready'));
</script>
<script src="/viewer-v3.js"></script>
<script src="/viewer-v3-patch.js"></script>
<script src="/viewer-v3-enhance.js"></script>
<script>
(function(){
  function normalizeFdi(v){
    const s=String(v ?? '').trim();
    if(/^[1-4][1-8]$/.test(s))return Number(s);
    const m=s.match(/(?:^|\D)([1-4][1-8])(?:\D|$)/);if(m)return Number(m[1]);
    const d=s.replace(/\D/g,'');if(d.length>=2){const t=d.slice(-2);if(/^[1-4][1-8]$/.test(t))return Number(t)}
    return v;
  }
  const enhancedRenderJaw=renderJaw;
  renderJaw=async function(){if(result&&Array.isArray(result.teeth)){for(const t of result.teeth){if(t)t.fdi=normalizeFdi(t.fdi)}}return enhancedRenderJaw();};
})();
</script>
<script>
(function(){
  const OPP={11:41,12:42,13:43,14:44,15:45,16:46,17:47,18:48,21:31,22:32,23:33,24:34,25:35,26:36,27:37,28:38};
  const med=a=>{const v=a.filter(Number.isFinite).slice().sort((x,y)=>x-y);return v.length?v[Math.floor(v.length/2)]:null};
  function visibleBiteLabel(){
    const teeth=(result?.teeth||[]).filter(t=>t?.bbox&&/^[1-4][1-8]$/.test(String(t.fdi)));
    const by=new Map(teeth.map(t=>[Number(t.fdi),t]));
    const gaps=[];
    for(const [u,l] of Object.entries(OPP)){
      const U=by.get(Number(u)),L=by.get(Number(l)); if(!U||!L)continue;
      const ub=U.bbox.map(Number),lb=L.bbox.map(Number);
      const uh=Math.max(1,ub[3]-ub[1]),lh=Math.max(1,lb[3]-lb[1]);
      const g=(lb[1]-ub[3])/Math.max(1,(uh+lh)/2);
      if(Math.abs(g)<=0.9)gaps.push(g);
    }
    const g=med(gaps);
    if(g===null)return 'temas değerlendirilemedi';
    if(g<=-0.08)return 'röntgende örtüşme görülüyor';
    if(g>=0.08)return 'röntgende temas görünmüyor';
    return 'temas belirsiz';
  }
  const previousAnalyze=analyze;
  analyze=async function(){
    await previousAnalyze();
    if(!result)return;
    const n=result.unique_fdi_count||result.tooth_count||0;
    const f=(result.findings||[]).filter(x=>x&&x.finding_code).length;
    $('status').textContent=`${n} diş • ${f} bulgu • kapanış: ${visibleBiteLabel()}`;
  };
  $('run').onclick=analyze;
})();
</script>
<script src="/viewer-v3-realjaw.js"></script>
</body>
</html>
