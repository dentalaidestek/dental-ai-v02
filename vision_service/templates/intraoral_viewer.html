<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dental AI — Ağız İçi Görüntü</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.app{max-width:980px;margin:auto;padding:14px}.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.top input{border:1px solid #d8dee8;border-radius:12px;padding:11px;background:#fff;min-width:0}.top input[type=file]{flex:1}.btn{border:0;border-radius:12px;padding:11px 15px;background:#172033;color:#fff;font-weight:800}.viewer{position:relative;background:#111;border-radius:18px;overflow:hidden;min-height:280px}.viewer img{display:block;width:100%;max-height:68vh;object-fit:contain}.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.filters{display:flex;gap:7px;overflow:auto;padding:10px 0}.filter{white-space:nowrap;border:1px solid #d8dee8;border-radius:999px;padding:8px 11px;background:#fff;font-weight:700}.filter.active{background:#172033;color:#fff}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#fff;border:1px solid #e1e6ee;border-radius:16px;padding:5px}.tab{border:0;border-radius:11px;padding:10px;background:transparent;font-weight:800}.tab.active{background:#eef2f7}.panel{display:grid;gap:10px;margin-top:10px}.card{padding:15px;background:#fff;border:1px solid #e3e8ef;border-radius:17px;cursor:pointer;box-shadow:0 3px 14px rgba(16,24,40,.045)}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.title{font-weight:850;font-size:15px}.badge{font-size:11px;font-weight:800;background:#f2f4f7;border-radius:999px;padding:5px 8px;white-space:nowrap}.sub,.note{font-size:12px;color:#667085;margin-top:5px;line-height:1.45}.description{margin-top:10px;padding:10px 11px;background:#f8fafc;border-radius:12px;font-size:13px;line-height:1.5;color:#344054}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.actions button{border:1px solid #d8dee8;background:#fff;border-radius:11px;padding:8px 6px;font-weight:750;color:#344054}.actions button:hover{background:#f7f8fa}.legend{font-size:11px;color:#667085;margin:9px 2px}.empty{padding:20px;text-align:center;color:#667085;background:#fff;border-radius:14px}.error{display:none;background:#feecec;color:#8b1e1e;padding:10px;border-radius:12px;margin-bottom:8px}@media(max-width:600px){.app{padding:8px}.viewer{border-radius:14px}.top input[type=password]{width:100%}}
</style></head><body><main class="app"><div class="top"><input id="key" type="password" placeholder="Güvenlik anahtarı"><input id="file" type="file" accept="image/*"><button id="run" class="btn">Görüntüyü yükle</button></div><div id="error" class="error"></div><section class="viewer"><img id="photo" alt="Ağız içi görüntü"><canvas id="overlay" class="overlay"></canvas></section><div id="filters" class="filters"></div><div class="legend">Kesin lokalizasyon veren motorlar görüntü üzerinde işaretlenir. Grad-CAM yalnız “modelin odaklandığı bölge” olarak gösterilir; lezyon sınırı değildir.</div><nav class="tabs"><button class="tab active" data-tab="findings">Bulgular</button><button class="tab" data-tab="treatments">Tedavi</button><button class="tab" data-tab="chart">Görünüm</button></nav><section id="panel" class="panel"></section></main><script src="/intraoral-viewer.js"></script></body></html>
