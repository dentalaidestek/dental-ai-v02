<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dental AI — Ağız İçi Görüntü</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.app{max-width:980px;margin:auto;padding:14px}.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.top input{border:1px solid #d8dee8;border-radius:12px;padding:11px;background:#fff;min-width:0}.top input[type=file]{flex:1}.btn{border:0;border-radius:12px;padding:11px 15px;background:#172033;color:#fff;font-weight:800}.viewer{position:relative;background:#111;border-radius:18px;overflow:hidden;min-height:280px}.viewer img{display:block;width:100%;max-height:68vh;object-fit:contain}.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.filters{display:flex;gap:7px;overflow:auto;padding:10px 0}.filter{white-space:nowrap;border:1px solid #d8dee8;border-radius:999px;padding:8px 11px;background:#fff;font-weight:700}.filter.active{background:#172033;color:#fff}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#fff;border:1px solid #e1e6ee;border-radius:16px;padding:5px}.tab{border:0;border-radius:11px;padding:10px;background:transparent;font-weight:800}.tab.active{background:#eef2f7}.panel{display:grid;gap:8px;margin-top:9px}.card{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;background:#fff;border:1px solid #e1e6ee;border-radius:14px;cursor:pointer}.title{font-weight:850}.sub,.note{font-size:12px;color:#667085;margin-top:3px}.score{font-weight:850}.actions{display:flex;gap:6px;margin-top:8px}.actions button{border:1px solid #d8dee8;background:#fff;border-radius:9px;padding:6px 8px;font-weight:700}.legend{font-size:11px;color:#667085;margin:9px 2px}.empty{padding:20px;text-align:center;color:#667085;background:#fff;border-radius:14px}.error{display:none;background:#feecec;color:#8b1e1e;padding:10px;border-radius:12px;margin-bottom:8px}@media(max-width:600px){.app{padding:8px}.viewer{border-radius:14px}.top input[type=password]{width:100%}}
</style></head><body><main class="app"><div class="top"><input id="key" type="password" placeholder="Güvenlik anahtarı"><input id="file" type="file" accept="image/*"><button id="run" class="btn">Analiz et</button></div><div id="error" class="error"></div><section class="viewer"><img id="photo" alt="Ağız içi görüntü"><canvas id="overlay" class="overlay"></canvas></section><div id="filters" class="filters"></div><div class="legend">Kesin lokalizasyon veren motorlar görüntü üzerinde işaretlenir. Grad-CAM yalnız “modelin odaklandığı bölge” olarak gösterilir; lezyon sınırı değildir.</div><nav class="tabs"><button class="tab active" data-tab="findings">Bulgular</button><button class="tab" data-tab="treatments">Tedavi</button><button class="tab" data-tab="chart">Diş şeması</button></nav><section id="panel" class="panel"></section></main><script src="/intraoral-viewer.js"></script></body></html>
