name: Security recovery regression
on:
  push:
    branches: ['work/security-privacy-*']
  pull_request:
    paths:
      - 'app/auth.py'
      - 'app/auth_rate.py'
      - 'app/account_erasure.py'
      - 'app/migrate.py'
      - 'app/ai_provider.py'
      - 'app/clinical_privacy.py'
      - 'app/clinical_rag_router.py'
      - 'app/main.py'
      - 'app/mobile_api.py'
      - 'app/mobile_analysis_api.py'
      - 'app/templates/login.html'
      - 'app/templates/expert_profile_edit.html'
      - 'app/static/expert-profile-form.js'
      - 'tests/profile_flow_ui.cjs'
      - 'vision_service/anatomy3d_direct_app.py'
      - 'tests/test_security*.py'
      - 'tests/test_mobile_account_parity.py'
      - 'app/mobile_account_api.py'
      - 'tests/test_mobile_patient_parity.py'
      - 'tests/test_mobile_boot.py'
      - 'tests/test_mobile_chat_actions.py'
      - 'tests/test_mobile_consultation_request.py'
      - 'tests/test_account_actions.py'
      - 'tests/test_auth_rate_shared.py'
      - 'tests/test_mobile_query_efficiency.py'
      - 'tests/test_web_push.py'
      - '.github/workflows/security-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dental_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: dental_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dental_test -d dental_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libtesseract-dev libleptonica-dev pkg-config
      - name: Install web and test dependencies
        run: python -m pip install -r requirements-web.lock pytest httpx numpy==2.5.3 opencv-python-headless==5.0.0.93
      - name: Validate security and identity recovery
        run: python -m pytest tests/test_mobile_account_parity.py tests/test_mobile_patient_parity.py tests/test_mobile_consultation_request.py tests/test_mobile_chat_actions.py tests/test_mobile_boot.py tests/test_email_change.py tests/test_logout_history.py tests/test_auth_ui_recovery.py tests/test_security_recovery.py tests/test_security_hardening.py tests/test_account_actions.py tests/test_web_push.py tests/test_auth_rate_shared.py tests/test_mobile_query_efficiency.py -q
      - name: Validate PostgreSQL migration and concurrent authentication
        env:
          DENTAL_TEST_DATABASE_URL: postgresql://dental_test:local-ci-only@localhost:5432/dental_test
        run: python -m pytest tests/test_postgres_optimization.py -q
      - name: Validate web form duplicate submission guards
        run: node --test tests/auth_form_submit.cjs tests/account_history.cjs tests/profile_flow_ui.cjs
