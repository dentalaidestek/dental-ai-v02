name: Security recovery regression
# Keep CI scoped to this development branch and its PR target.
# PR synchronize events validate the branch without duplicating a push run.
on:
  pull_request:
    branches:
      - feature/mobile-beta-20261110
    paths:
      - ".github/workflows/security-recovery.yml"
      - ".github/workflows/mobile-android.yml"
      - "app/**"
      - "tests/**"
      - "mobile/**"
      - "docs/account-erasure-guest-cleanup-20261120.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-recovery-${{ github.event.pull_request.head.ref || github.ref }}
  # Preserve the active Python/PostgreSQL and native security suites across commits.
  # A newer pending PR run supersedes older pending runs without killing the active run.
  cancel-in-progress: false
jobs:
  native-voice-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install native voice regression dependencies
        run: npm ci
      - name: Validate native voice recovery and private audio path containment
        run: node --test tests/nativeVoiceAudio.cjs tests/voiceAudioImport.cjs tests/voiceDraftScope.cjs tests/voiceWorkflow.cjs tests/voiceDeviceCheck.cjs tests/voiceDeviceCheckUI.cjs
  native-clinical-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install native clinical regression dependencies
        run: npm ci
      - name: Validate clinical result schema, restart recovery and web viewer parity
        run: |
          set -o pipefail
          node --test tests/clinicalWorkflow.cjs tests/visionViewer.cjs tests/patientApi.cjs tests/analysisHistoryScope.cjs tests/patientProfileUI.cjs tests/patientVoiceHistory.cjs tests/voiceEvidence.cjs tests/voiceApi.cjs tests/voiceWorkflow.cjs tests/patientHistoryWebPaging.cjs tests/patientHistoryRetry.cjs tests/patientAnalysisHistoryCursor.cjs tests/patientTreatmentPresentation.cjs tests/patientTreatmentHistoryExpansion.cjs 2>&1 | tee "$RUNNER_TEMP/native-clinical-security.log"
      - name: Preserve native clinical security diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-clinical-security-diagnostics
          path: ${{ runner.temp }}/native-clinical-security.log
          if-no-files-found: warn
          retention-days: 7
  native-social-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install native social regression dependencies
        run: npm ci
      - name: Validate Dental Flow moderation, identity and draft behavior
        run: node --test tests/social.cjs tests/socialScreens.cjs tests/socialModerationRefresh.cjs tests/socialMediaViewer.cjs tests/socialAdminStepUp.cjs tests/socialAdminScreen.cjs
  native-support-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install native support regression dependencies
        run: npm ci
      - name: Validate support account isolation, recovery and API contracts
        run: node --test tests/supportRequests.cjs tests/supportDraftScope.cjs
  native-academic-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install native Academic regression dependencies
        run: npm ci
      - name: Validate Academic workflow, parser and private upload boundary
        run: node --test tests/academicWorkflow.cjs tests/academicComposer.cjs tests/academicFileSecurity.cjs tests/academicFileHash.cjs tests/academicUploadQueue.cjs
  native-program-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install native Program regression dependencies
        run: npm ci
      - name: Validate account-scoped Program recovery, copy identity and appointment parity
        run: node --test tests/programParity.cjs tests/programIntent.cjs tests/appointmentParity.cjs
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dental_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: dental_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dental_test -d dental_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libtesseract-dev libleptonica-dev pkg-config
      - name: Install web and test dependencies
        run: python -m pip install -r requirements-web.lock pytest httpx numpy==2.5.3 opencv-python-headless==5.0.0.93
      - name: Validate security and identity recovery
        env:
          TEST_POSTGRES_URL: postgresql://dental_test:local-ci-only@localhost:5432/dental_test
        run: |
          set -o pipefail
          python -m pytest tests/test_approved_anamnesis_migration.py tests/test_approved_anamnesis_postgres_concurrency.py tests/test_voice_exam.py tests/test_voice_exam_live.py tests/test_clinical_media_sanitizer.py tests/test_blueprint_boundaries.py tests/test_mobile_expert_performance.py tests/test_mobile_vision_viewer.py tests/test_mobile_analysis_upload_receipt.py tests/test_web_analysis_upload_recovery.py tests/test_mobile_clinical_workflow.py tests/test_mobile_academic_workflow.py tests/test_mobile_voice_workflow.py tests/test_voice_asr_receipts.py tests/test_voice_clinical_receipts.py tests/test_mobile_expert_profile.py tests/test_mobile_professional_parity.py tests/test_mobile_program_parity.py tests/test_mobile_program_api.py tests/test_mobile_account_parity.py tests/test_mobile_patient_parity.py tests/test_patient_history_pagination.py tests/test_tooth_surface_status.py tests/test_patient_media_receipts.py tests/test_patient_media_cleanup.py tests/test_mobile_consultation_request.py tests/test_mobile_consultation_live_api.py tests/test_mobile_support_api.py tests/test_mobile_chat_actions.py tests/test_mobile_boot.py tests/test_mobile_route_registry.py tests/test_email_change.py tests/test_logout_history.py tests/test_auth_ui_recovery.py tests/test_security_recovery.py tests/test_security_hardening.py tests/test_account_actions.py tests/test_account_erasure_cleanup.py tests/test_web_push.py tests/test_mobile_notifications.py tests/test_mobile_push.py tests/test_mobile_push_receipts.py tests/test_mobile_push_registration.py tests/test_auth_rate_shared.py tests/test_mobile_dashboard.py tests/test_mobile_query_efficiency.py tests/expert_social/test_dental_flow.py tests/expert_social/test_native_auth.py tests/expert_social/test_schema.py tests/test_ci_concurrency_contract.py -q 2>&1 | tee "$RUNNER_TEMP/security-pytest.log"
      - name: Preserve Python security diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: python-security-diagnostics
          path: ${{ runner.temp }}/security-pytest.log
          if-no-files-found: warn
          retention-days: 7
      - name: Validate PostgreSQL migration and concurrent authentication
        env:
          DENTAL_TEST_DATABASE_URL: postgresql://dental_test:local-ci-only@localhost:5432/dental_test
        run: python -m pytest tests/test_postgres_optimization.py -q
      - name: Validate web form and live voice browser regressions
        if: always()
        run: node --test tests/auth_form_submit.cjs tests/account_history.cjs tests/profile_flow_ui.cjs tests/voice_live_browser.cjs
