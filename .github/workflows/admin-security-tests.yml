name: Admin security regression
# Temporarily manual-only while hosted CI jobs fail before their first step.
# Restore automatic push/pull_request triggers after runner availability is confirmed.
on:
  workflow_dispatch:
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate web moderation queue request supersession
        run: node --test tests/expert_social_admin_queue.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run static regression tests
        run: python -m pytest -q tests/test_admin_fixed_email_otp.py tests/test_security_hardening.py tests/expert_social/test_native_auth.py
      - name: Compile application source
        run: python -m py_compile app/main.py
