name: Academic V2 CI
# PR gate: compile + deterministic Academic V2 behavior checks.

on:
  workflow_dispatch:
  # Keep PR validation reliable; job-level change detection can optimize later.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "app/study_ai_v2.py"
      - "app/study_retrieval_v2.py"
      - "app/dental_retrieval_terms.py"
      - "app/dental_knowledge_graph.py"
      - "app/dental_query_intent.py"
      - "app/dental_semantics.py"
      - "app/dental_academic_scope.py"
      - "app/dental_specialty_concepts.py"
      - "app/study_provider.py"
      - "app/study_local_ocr.py"
      - "app/study_index_worker.py"
      - "app/study_index_jobs.py"
      - "app/study_chunking.py"
      - "app/migrate.py"
      - "app/dental_ocr_words.txt"
      - "app/study_router_state.py"
      - "tests/academic_v2/**"
      - ".github/workflows/academic-v2-ci.yml"

permissions:
  contents: read

concurrency:
  group: academic-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Academic V2 modules
        run: |
          python -m py_compile app/study_ai_v2.py app/study_retrieval_v2.py app/academic_coverage.py app/academic_generation.py app/academic_generation_jobs.py app/dental_retrieval_terms.py app/dental_knowledge_graph.py app/dental_query_intent.py app/dental_semantics.py app/dental_academic_scope.py app/dental_specialty_concepts.py app/study_provider.py app/study_router_state.py app/study_local_ocr.py app/study_index_worker.py app/study_index_jobs.py app/study_chunking.py app/migrate.py
      - name: Run Academic V2 invariant tests
        run: |
          python tests/academic_v2/test_static_invariants.py
          python tests/academic_v2/test_retrieval_behavior.py
          python tests/academic_v2/test_dental_graph.py
          python tests/academic_v2/test_dental_intent.py
          python tests/academic_v2/test_dental_semantics.py
          python tests/academic_v2/test_academic_scope.py\n          python tests/academic_v2/test_academic_coverage.py\n          python tests/academic_v2/test_academic_generation.py\n          python tests/academic_v2/test_academic_generation_jobs.py
