name: Academic V2 CI
# PR gate: compile + deterministic Academic V2 behavior checks.

on:
  workflow_dispatch:
  # Always validate pull requests to main. Required checks must not disappear
  # because a path filter evaluated differently on the base branch.
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "work/academic-v2-*"
      - "release/academic-v2-clean-*"
    paths:
      - "app/study_ai_v2.py"
      - "app/academic_coverage.py"
      - "app/academic_generation.py"
      - "app/academic_generation_jobs.py"
      - "app/study_retrieval_v2.py"
      - "app/dental_retrieval_terms.py"
      - "app/dental_knowledge_graph.py"
      - "app/dental_knowledge_relations.py"
      - "app/dental_query_intent.py"
      - "app/dental_semantics.py"
      - "app/dental_academic_scope.py"
      - "app/dental_specialty_concepts.py"
      - "app/dental_specialty_concepts_extended.py"
      - "app/study_provider.py"
      - "app/study_local_ocr.py"
      - "app/study_index_worker.py"
      - "app/study_index_jobs.py"
      - "app/study_chunking.py"
      - "app/migrate.py"
      - "app/dental_ocr_words.txt"
      - "app/study_router_state.py"
      - "tests/academic_v2/**"
      - ".github/workflows/academic-v2-ci.yml"

permissions:
  contents: read

# Push and pull_request events for the same commit may overlap. Do not let one
# cancel the other while the deterministic suite is still running.
concurrency:
  group: academic-v2-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production web dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-web.lock
      - name: Compile Academic V2 modules
        run: |
          python -m py_compile app/study_ai_v2.py app/study_retrieval_v2.py app/academic_coverage.py app/academic_generation.py app/academic_generation_jobs.py app/dental_retrieval_terms.py app/dental_knowledge_graph.py app/dental_knowledge_relations.py app/dental_query_intent.py app/dental_semantics.py app/dental_academic_scope.py app/dental_specialty_concepts.py app/dental_specialty_concepts_extended.py app/study_provider.py app/study_router_state.py app/study_local_ocr.py app/study_index_worker.py app/study_index_jobs.py app/study_chunking.py app/migrate.py
      - name: Run Academic V2 invariant and function tests
        run: python tests/academic_v2/run_tests.py
      - name: Run 89K past-question note holdout standalone
        run: python -c "from tests.academic_v2.test_past_question_note_holdout_89k import test_unseen_89k_past_question_note_workflow_holdout as t; t()"
