name: Mobile Android CI

on:
  push:
    branches:
      - "mobile/**"
  pull_request:
    paths:
      - "mobile/**"
      - "app/mobile_api.py"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - run: npm install
      - run: npm run typecheck
