name: Mobile Android CI

on:
  push:
    branches:
      - 'mobile/**'
      - 'feature/mobile-*'
      - 'work/security-privacy-*'
  pull_request:
    paths:
      - 'mobile/**'
      - 'app/mobile_api.py'
      - 'app/mobile_analysis_api.py'
      - 'app/mobile_modern_api.py'
      - 'app/mobile_modern_api_v3.py'
      - 'app/main.py'
      - 'app/expert_social_api.py'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npx expo export --platform android --platform ios
  beta-apk:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # Standalone JS bundle, signed with the generated development key only.
      # This is an internal test APK, never a store signing credential.
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: dental-ai-beta-arm64
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

