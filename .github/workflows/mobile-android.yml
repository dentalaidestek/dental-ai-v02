name: Mobile Android CI

on:
  push:
    branches:
      - 'mobile/**'
      - 'feature/mobile-*'
      - 'work/security-privacy-*'
  pull_request:
    paths:
      - 'mobile/**'
      - 'app/mobile_api.py'
      - 'app/mobile_analysis_api.py'
      - 'app/mobile_modern_api.py'
      - 'app/mobile_modern_api_v3.py'
      - 'app/main.py'
      - 'app/expert_social_api.py'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install mobile dependencies
        id: install
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "$RUNNER_TEMP/mobile-install.log"
      - name: Preserve dependency installation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-install-diagnostics
          path: ${{ runner.temp }}/mobile-install.log
          if-no-files-found: warn
          retention-days: 7
      # Keep independent diagnostics running even if an earlier check fails.
      # Skip them only when installation fails or the workflow is cancelled.
      - name: TypeScript typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/mobile-typecheck.log"
      - name: Preserve TypeScript diagnostics
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-typecheck-diagnostics
          path: ${{ runner.temp }}/mobile-typecheck.log
          if-no-files-found: warn
          retention-days: 7
      - name: Print failed check summary
        if: ${{ always() }}
        run: |
          echo "## Mobile CI diagnostics" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/mobile-install.log" ]; then
            echo "### Dependency install (last 45 lines)" >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 45 "$RUNNER_TEMP/mobile-install.log" >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/mobile-typecheck.log" ]; then
            echo "### TypeScript (last 75 lines)" >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 75 "$RUNNER_TEMP/mobile-typecheck.log" >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Session and authentication tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:session
      - name: Realtime and pagination tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:realtime
      - name: Mobile beta regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:beta
      - name: Export Android and iOS JavaScript bundles
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx expo export --platform android --platform ios
  beta-apk:
    # Build an installable internal APK independently so test failures remain visible
    # without blocking device evaluation; never deploy or publish this artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to the retired `tools` package. Install only
          # supported SDK packages so setup can reach the actual APK build.
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      # Standalone JS bundle, signed with the generated development key only.
      # This is an internal test APK, never a store signing credential.
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: dental-ai-beta-arm64
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14


