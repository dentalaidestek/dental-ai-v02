name: Voice examination regression
on:
  pull_request:
    paths:
      - 'app/voice_*.py'
      - 'app/clinical_privacy.py'
      - 'app/static/voice-*.js'
      - 'app/static/voice-*.css'
      - 'app/templates/voice_*.html'
      - 'scripts/build_voice_literature.py'
      - 'scripts/build_voice_clinic_audio.py'
      - 'scripts/import_voice_drug_labels.py'
      - 'scripts/evaluate_voice_spoken.py'
      - 'scripts/score_voice_clinical_review.py'
      - 'tests/fixtures/voice_clinical_review_template.json'
      - 'tests/fixtures/voice_spoken_cases.json'
      - 'tests/fixtures/voice_published_case_dialogues.json'
      - 'tests/fixtures/voice_clinic90*.json'
      - 'app/data/voice_drug_sources.jsonl'
      - 'tests/test_voice*.py'
      - 'tests/voice*.cjs'
      - '.github/workflows/voice-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install voice regression dependencies
        run: python -m pip install pytest httpx fastapi==0.141.1 sqlmodel==0.0.44 sqlalchemy==2.0.54 pydantic==2.13.5 starlette==1.6.0 jinja2==3.1.6 urllib3==2.8.0 websockets==15.0.1
      - name: Verify source, privacy, access and clinical grounding
        run: python -m pytest -q tests/test_voice*.py
      - name: Install integrated DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/voice-dom" --no-audit --no-fund jsdom@30.1.3
      - name: Verify browser lifecycle and transcript checkpoints
        env:
          NODE_PATH: ${{ runner.temp }}/voice-dom/node_modules
        run: node --test tests/voice*.cjs
