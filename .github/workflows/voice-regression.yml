name: Voice examination regression
on:
  pull_request:
    paths:
      - 'app/voice_*.py'
      - 'app/clinical_privacy.py'
      - 'app/static/voice-*.js'
      - 'app/templates/voice_*.html'
      - 'scripts/build_voice_literature.py'
      - 'tests/test_voice*.py'
      - 'tests/voice*.cjs'
      - '.github/workflows/voice-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install voice regression dependencies
        run: python -m pip install pytest httpx fastapi==0.141.1 sqlmodel==0.0.44 sqlalchemy==2.0.54 pydantic==2.13.5 starlette==1.6.0 jinja2==3.1.6 urllib3==2.8.0 websockets==15.0.1
      - name: Verify source, privacy, access and clinical grounding
        run: python -m pytest -q tests/test_voice*.py
      - name: Verify browser lifecycle and transcript checkpoints
        run: node --test tests/voice*.cjs
