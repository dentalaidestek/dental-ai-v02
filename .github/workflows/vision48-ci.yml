name: vision48-ci

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "work/**"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application and training code
        run: python -m compileall -q vision_service app tests training
      - name: Vision48, training-plan, no-pixels-to-LLM and photo3D contract tests
        run: python -m unittest tests.test_vision_registry tests.test_training_sources tests.test_derived48 tests.test_pipeline_contract tests.test_ai_image_policy tests.test_photo3d_contract -v

  ready-model-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight checkpoint inspectors
        run: python -m pip install --disable-pip-version-check -q huggingface_hub onnx
      - name: Verify Liodon remote ONNX weight and exact class metadata
        run: python tests/check_liodon_remote_model.py
