name: vision48-ci

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "work/**"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application code
        run: python -m compileall -q vision_service app tests
      - name: Vision 48 registry/composed/pipeline contract tests
        run: python -m unittest tests.test_vision_registry tests.test_derived48 tests.test_pipeline_contract -v
