name: Academic read-only diagnostics
on:
  workflow_dispatch:
  push:
    branches:
      - work/modal-academic-indexing-20261005
    paths:
      - scripts/modal_academic_diagnostics.py
      - .github/workflows/academic-readonly-diagnostics.yml
permissions:
  contents: read
concurrency:
  group: academic-readonly-diagnostics
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require Modal credentials
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
      - name: Install Modal
        run: python -m pip install --disable-pip-version-check "modal>=1.2,<2"
      - name: Read queue without waking workers
        run: python -m modal run scripts/modal_academic_diagnostics.py
