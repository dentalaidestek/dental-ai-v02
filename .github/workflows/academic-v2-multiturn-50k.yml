name: Academic V2 Multi-turn 50K
on:
  push:
    branches:
      - release/academic-v2-clean-20261003
      - work/continuity-gold-consistency-20261005
    paths:
      - '.github/workflows/academic-v2-multiturn-50k.yml'
      - 'scripts/benchmark_multiturn_continuity_50k.py'
      - 'tests/academic_v2/multiturn_50k_generator.py'
      - 'tests/academic_v2/multiturn_50k_taxonomy.py'
      - 'app/study_retrieval_v2.py'
      - 'app/dental_query_intent.py'
  workflow_dispatch:
concurrency:
  group: academic-v2-multiturn-50k-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuity-50k:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum resolver dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
      - name: Compile benchmark files
        run: |
          python -m py_compile tests/academic_v2/multiturn_50k_taxonomy.py tests/academic_v2/multiturn_50k_generator.py scripts/benchmark_multiturn_continuity_50k.py app/study_retrieval_v2.py
      - name: Smoke import and 10 continuity cases
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python - <<'PY'
          import json
          from tests.academic_v2.multiturn_50k_generator import generate, validate_cases
          from scripts.benchmark_multiturn_continuity_50k import score
          try:
              cases=generate(50000)
          except AssertionError:
              from tests.academic_v2.multiturn_50k_generator import build
              probe=[build(i) for i in range(50000)]
              bad=[c for c in probe if c.expected.get("_gold_unsupported_pre_noise")]
              print("GOLD_UNSUPPORTED_DIAG", len(bad))
              from collections import Counter
              for state_name in ("replace_count","inherit_count","inherit_goal","inherit_format","replace_task","replace_goal","clear_goal","replace_format","clear_format","clear_count"):
                  subset=[x for x in probe if x.axes.get("state")==state_name]
                  diag=Counter()
                  for x in subset:
                      q=str(x.expected.get("_semantic_query_pre_noise") or x.query).casefold()
                      diag[(x.axes.get("reference"),x.axes.get("interaction"),bool(x.expected.get("should_abstain")),"20" in q,"aynı sayıda" in q)] += 1
                  print("STATE_OBSERVABILITY_DIAG",state_name,diag.most_common(30))
              for c in bad[:20]:
                  print(json.dumps({"id":c.case_id,"axes":c.axes,"history":c.history,"query":c.query,"must":c.must,"must_not":c.must_not,"expected":c.expected},ensure_ascii=False))
              raise
          assert len(cases)==50000
          assert len({c.case_id for c in cases})==50000
          quality=validate_cases(cases)
          assert quality["semantic_unique_ratio"] >= 0.90
          for case in cases[:100]:
              score(case)
          print("SMOKE_OK", len(cases), "UNIQUE", len({c.case_id for c in cases}), "SEMANTIC", quality["semantic_unique_ratio"])
          diag=[case for case in cases if case.axes.get("reference")=="multi_hop"][:20]
          print("MULTIHOP_DIAG")
          for case in diag:
              ok,reason,detail,out=score(case)
              print(json.dumps({"id":case.case_id,"state":case.axes.get("state"),"language":case.axes.get("language"),"distractor":case.axes.get("distractor"),"query":case.query,"history":case.history,"must":case.must,"expected":case.expected,"ok":ok,"reason":reason,"detail":detail,"resolved":out},ensure_ascii=False))
          PY
      - name: Run only 50K multi-turn continuity benchmark
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" python -m scripts.benchmark_multiturn_continuity_50k --count 50000 --report /tmp/multiturn_50k_report.json
      - name: Print failure summary
        if: always()
        run: |
          if [ -f /tmp/multiturn_50k_report.json ]; then
            python - <<'PY'
          import json
          p=json.load(open('/tmp/multiturn_50k_report.json'))
          print(json.dumps({k:p.get(k) for k in ('count','quality','passed','accuracy','failure_reasons','elapsed_s','cases_per_s')},ensure_ascii=False,indent=2))
          samples=p.get('failure_samples_by_reason') or p.get('reason_samples') or {}
          for reason in ('missing_required','stale_context','stale_qualifier','count_loss','format_loss','task_loss','goal_loss'):
              if samples.get(reason):
                  print('FAILURE_SAMPLES',reason)
                  print(json.dumps(samples[reason][:5],ensure_ascii=False,indent=2))
          PY
          else
            echo "50K report not produced"
          fi
