name: Recover verified Ortoo OCR checkpoints
on:
  push:
    branches: [work/modal-academic-indexing-20261005]
    paths: [scripts/modal_academic_recover_ortoo.py, .github/workflows/recover-ortoo-ocr.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: recover-ortoo-ocr
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require verified OCR repair deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/dentalaidestek/dental-ai-v02/actions/workflows/deploy-academic-modal.yml/runs?head_sha=26deb7a9982f80ee4f314320992fbb28a98d3245' --jq '.workflow_runs | any(.conclusion == "success")' | python -c 'import sys; assert sys.stdin.read().strip() == "true"'
      - name: Install Modal
        run: python -m pip install --disable-pip-version-check "modal>=1.2,<2" "fastapi==0.141.1"
      - name: Resume existing generations and verify watchdog recovery
        run: python -m modal run scripts/modal_academic_recover_ortoo.py

