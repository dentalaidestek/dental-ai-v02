name: Academic semantic flow
on:
  push:
    branches: ['work/academic-semantic-*']
    paths: ['app/**', 'tests/academic_v2/**', 'scripts/evaluate_academic_note_flow.py', '.github/workflows/academic-semantic-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: academic-semantic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: academic
          POSTGRES_PASSWORD: academic-test-only
          POSTGRES_DB: academic
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-web.lock pytest pytest-subtests
      - name: Verify planner, evidence gates and real owned FTS
        env:
          ACADEMIC_TEST_DATABASE_URL: postgresql+psycopg2://academic:academic-test-only@localhost:5432/academic
        run: python -m pytest -q tests/academic_v2/test_semantic_request_understanding.py tests/academic_v2/test_semantic_postgres.py tests/academic_v2/test_retrieval_recovery.py tests/test_study_retrieval_v2.py tests/academic_v2/test_retrieval_behavior.py tests/academic_v2/test_static_invariants.py
