name: Academic semantic flow
on:
  push:
    branches: ['work/academic-semantic-*']
    paths: ['app/**', 'tests/academic_v2/**', 'evaluation/academic/**', 'scripts/evaluate_academic_note_flow.py', '.github/workflows/academic-semantic-ci.yml']
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Run at most eight real Gemini note-flow cases'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: academic-semantic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: academic
          POSTGRES_PASSWORD: academic-test-only
          POSTGRES_DB: academic
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-web.lock pytest pytest-subtests
      - name: Verify planner, evidence gates and real owned FTS
        env:
          ACADEMIC_TEST_DATABASE_URL: postgresql+psycopg2://academic:academic-test-only@localhost:5432/academic
        run: python -m pytest -q tests/academic_v2/test_direct_request.py tests/academic_v2/test_source_batches.py tests/academic_v2/test_batch_generation.py tests/academic_v2/test_semantic_request_understanding.py tests/academic_v2/test_gemini_only_flow.py tests/academic_v2/test_semantic_postgres.py tests/academic_v2/test_source_matching_matrix.py tests/academic_v2/test_native_page_evidence.py tests/academic_v2/test_adaptive_evidence_context.py tests/academic_v2/test_dense_retrieval.py tests/academic_v2/test_quiz_contract.py tests/academic_v2/test_quick_action_speed.py tests/academic_v2/test_anthropic_provider.py tests/academic_v2/test_exam_inventory.py tests/academic_v2/test_question_output.py tests/academic_v2/test_ali_kiki_flow.py tests/academic_v2/test_retrieval_recovery.py tests/test_study_retrieval_v2.py tests/academic_v2/test_retrieval_behavior.py tests/academic_v2/test_static_invariants.py
      - name: Run authorized real Gemini note flow when secure key is configured
        if: contains(github.event.head_commit.message, '[real-gemini]') || inputs.run_live == true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACADEMIC_TEST_DATABASE_URL: postgresql+psycopg2://academic:academic-test-only@localhost:5432/academic
        run: |
          mkdir -p evaluation-output
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          out = Path('evaluation-output/real-note-flow.json')
          if not os.getenv('GEMINI_API_KEY'):
              out.write_text(json.dumps({'live_calls_made':False,'blocked':'GEMINI_API_KEY repository secret is not configured'}))
              print('Real API evaluation blocked: no configured test key. No calls made.')
              sys.exit(2)
          else:
              with out.open('w') as report:
                  result = subprocess.run([sys.executable,'scripts/evaluate_academic_note_flow.py',
                      '--source-fixture','evaluation/academic/cephalometric_text_fixture.json',
                      '--run','--answers','--limit','8'],stdout=report)
              sys.exit(result.returncode)
          PY
      - name: Retain actual API and retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academic-real-note-flow
          path: evaluation-output/
          retention-days: 7
