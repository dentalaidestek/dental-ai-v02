name: Android beta APK (artifact — non-public)

# Beta APK YALNIZCA artifact olarak yayınlanir (Actions sayfasindan, repo erişimi
# olan hesaplarla indirilebilir). Herkese açık GitHub Release OLUŞTURULMAZ.
# YALNIZCA IC TEST: magaza yayini veya uretim surumu degildir; main'e merge edilmez,
# canli deploy ve uretim veritabani bu is akisindan etkilenmez.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/mobile-ux-parity-20261125
      - fix/mobile-ai-flows-20261128
    paths:
      - ".github/workflows/android-test-apk.yml"
permissions:
  contents: read
concurrency:
  group: android-test-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # actions/cache (gradle) BILEREK YOK: RN gradle eklentisinin JS-bundle task'i
      # gradle build-cache'den RESTORE edilerek bayat bundle'la paketleniyordu
      # (kaynak yeni olsa bile). Cache'siz + clean + --rerun-tasks ile bundle
      # her zaman kontrol edilen agactan sifirdan uretilir.
      # android-actions/setup-android bilerek yok: kaldirilmis 'tools' paketi hata
      # veriyordu; ubuntu-latest runner'inda calisan bir ANDROID_HOME SDK hazir gelir.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # TypeScript/test dogrulamalari Mobile Android CI (PR tetikli) is akisinda
      # ayri job'larda kosuyor; temiz CI ortaminda expo-secure-store stub cozumlemesi
      # prebuild gerektirdigi icin test burada degil, orada dogrulanir.
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Verify generated Android microphone permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST" || { echo 'RECORD_AUDIO missing from generated Android manifest'; exit 1; }
          echo 'RECORD_AUDIO present in generated Android manifest.'
      - name: Build standalone release APK (arm64-v8a, JS bundle embedded, forced fresh)
        working-directory: mobile/android
        run: ./gradlew clean assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 --rerun-tasks
      # Kapı, Hermes bytecode'daki string tablosunu UTF-16LE olarak da arar:
      # Türkçe stringler bytecode'da UTF-16 bolgesinde saklanir, yalniz UTF-8
      # aramasi tum stringleri bulamaz (yanlis 'bayat bundle' teshisine yol acar).
      - name: Verify bundle freshness (feature strings must exist — fail on stale bundle)
        run: |
          set -o pipefail
          python3 - <<'PYEOF'
          import zipfile, sys, glob
          apks = glob.glob('android/app/build/outputs/apk/release/*.apk')
          assert apks, 'release APK bulunamadi'
          z = zipfile.ZipFile(apks[0])
          bn = [n for n in z.namelist() if 'index.android.bundle' in n][0]
          raw = z.read(bn)
          # Hermes bytecode ASCII stringleri duz, Turkce (non-ASCII) stringleri
          # UTF-16LE bolgesinde tutar; ikisini de aramadan 'yok' sonucu cikmaz.
          def present(s):
            return s.encode('utf-8') in raw or s.encode('utf-16-le') in raw
          required = {
            'Destek Talebi Oluştur': 'profil DESTEK bölümü + Profil sekmesi girişi',
            'Hakkımızda': 'anasayfa/profil bilgi penceresi (376ebd12)',
            'Topluluk ve İletişim Kuralları': 'yasal metin (376ebd12)',
            'Gönderiliyor': 'Destek Talepleri ekranı (376ebd12)',
            'Sorun Bildir': 'görüşme menüsü (7288993f)',
          }
          missing = [f'{k} ({v})' for k, v in required.items() if not present(k)]
          if missing:
            print('BAYAT BUNDLE — bu stringler bundle\'da YOK:')
            for m in missing: print('  -', m)
            sys.exit(1)
          print('Bundle taze: tüm özellik stringleri bundle içinde (utf-8 + utf-16le araması).')
          PYEOF
      - name: Prepare named APK artifact
        run: |
          set -o pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/dental-ai-beta-arm64-v7.apk"
          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          {
            echo "## Beta APK v4 hazır (artifact — herkese açık release YOK)"
            echo ""
            echo "- İndirme: bu sayfanın **Artifacts** bölümünden \`dental-ai-beta-arm64-v7\` (repo erişimi olan hesapla)"
            echo "- Kaynak commit: \`${{ github.sha }}\`"
            echo "- versionCode: **7** (paket: tr.dentalai.app) — kurulu sürümlerin üzerine yüklenebilir; mikrofon preflight metering zorunluluğu kaldırıldı (ses testi metering'siz cihazlarda da geçer) + AI Analiz ilk hastayı otomatik seçer ve sadeleşti"
            echo "- Dosya: dental-ai-beta-arm64-v7.apk (arm64-v8a, JS bundle gömülü)"
            echo "- sha256: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dental-ai-beta-arm64-v7
          path: ${{ runner.temp }}/dental-ai-beta-arm64-v7.apk
          if-no-files-found: error
          retention-days: 14
