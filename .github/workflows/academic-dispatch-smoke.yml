name: Academic authenticated wake smoke
on:
  workflow_dispatch:
  push:
    branches:
      - work/modal-academic-indexing-20261005
    paths:
      - scripts/modal_academic_dispatch_smoke.py
      - .github/workflows/academic-dispatch-smoke.yml
permissions:
  contents: read
concurrency:
  group: academic-dispatch-smoke
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require Modal credentials
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
      - name: Install Modal
        run: python -m pip install --disable-pip-version-check "modal>=1.2,<2" "fastapi==0.141.1"
      - name: Authenticate wake with an empty durable queue
        run: python -m modal run scripts/modal_academic_dispatch_smoke.py
