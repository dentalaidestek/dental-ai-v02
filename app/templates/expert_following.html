{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="/static/expert-social.css?v=20261109-3">
<link rel="stylesheet" href="/static/dental-flow.css?v=20261109-1">
<div class="dental-flow-page">
  <header class="dental-flow-head">
    <div><span class="dental-flow-kicker">Uzmanlardan mesleki paylaşımlar</span><h1>Dental Akış</h1></div>
    <a class="dental-flow-directory" href="/expert-support">Uzmanları keşfet <span aria-hidden="true">↗</span></a>
  </header>
  <nav class="dental-flow-tabs" aria-label="Dental Akış bölümleri">
    <a href="/dental-akis?tab=discover{% if selected_specialty %}&amp;specialty={{ selected_specialty|urlencode }}{% endif %}"{% if feed_mode=='discover' %} aria-current="page"{% endif %}>Keşfet</a>
    <a href="/dental-akis?tab=following{% if selected_specialty %}&amp;specialty={{ selected_specialty|urlencode }}{% endif %}"{% if feed_mode=='following' %} aria-current="page"{% endif %}>Takip Ettiklerim</a>
  </nav>
  <nav class="dental-flow-filters" aria-label="Branşa göre filtrele">
    <a href="/dental-akis?tab={{ feed_mode }}"{% if not selected_specialty %} aria-current="true"{% endif %}>Tümü</a>
    {% for specialty in specialties %}<a href="/dental-akis?tab={{ feed_mode }}&amp;specialty={{ specialty|urlencode }}"{% if selected_specialty==specialty %} aria-current="true"{% endif %}>{{ specialty }}</a>{% endfor %}
  </nav>
  <section id="expertSocial" class="ds-root dental-flow-feed" data-expert-social data-feed-mode="{{ feed_mode }}" data-feed-specialty="{{ selected_specialty }}" data-owner="0" data-expert-id="0" data-user-id="{{ user.id }}" data-user-name="{{ user.display_name }}" data-user-photo="{{ profile_photo_url(user) if user.profile_photo_path else '' }}" aria-label="{{ 'Keşfet gönderileri' if feed_mode=='discover' else 'Takip edilen uzmanların gönderileri' }}">
    <p class="ds-notice" role="status" aria-live="polite" data-notice hidden></p>
    <p class="dental-flow-loading" role="status" data-feed-loading>Paylaşımlar yükleniyor…</p>
    <div class="ds-feed" data-feed aria-live="polite"></div>
    <button type="button" class="ds-secondary ds-more" data-more-posts hidden>Daha fazla gönderi</button>
  </section>
</div>
<script src="/static/expert-media-viewer.js?v=1" defer></script>
<script src="/static/expert-social.js?v=20261109-3" defer></script>
{% endblock %}
