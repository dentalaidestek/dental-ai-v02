<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DENTAL-AI - Şifremi Unuttum</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.box {
    width: min(420px, 92%);
    background: white;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.10);
}
h1 {
    text-align: center;
    margin-top: 0;
}
h2 {
    text-align: center;
    margin-bottom: 25px;
}
label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}
input {
    width: 100%;
    padding: 12px;
    margin-bottom: 18px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}
button {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 15px;
}
.info {
    background: #dcfce7;
    color: #166534;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 15px;
}
.link {
    text-align: center;
    margin-top: 18px;
}
a {
    color: #2563eb;
    text-decoration: none;
}
</style>
    <link rel="stylesheet" href="/static/design-system.css">
</head>
<body class="dai-standalone">
<div class="box">
    <h1>🦷 DENTAL-AI</h1>
    <h2>Şifremi Unuttum</h2>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    {% if message %}
    <div class="info">{{ message }}</div>
    {% endif %}

    <form method="post" action="/forgot-password">
        <label for="email">Kayıtlı e-posta adresiniz</label>
        <input
            id="email"
            type="email"
            name="email"
            autocomplete="email"
            required
        >
        <button type="submit">Şifre Sıfırlama Bağlantısı Gönder</button>
    </form>

    <div class="link">
        <a href="/login">Giriş sayfasına dön</a>
    </div>
</div>
</body>
</html>
