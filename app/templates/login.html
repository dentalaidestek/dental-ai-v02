<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DENTAL-AI - Giriş</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px 15px;
        }

        .box {
            max-width: 420px;
            margin: 40px auto;
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        h1, h2 {
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccd3dd;
            border-radius: 9px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .link {
            text-align: center;
            margin-top: 18px;
        }

        a {
            color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🦷 DENTAL-AI</h1>
        <h2>Giriş Yap</h2>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <label>Kullanıcı adı veya e-posta</label>
            <input
                type="text"
                name="login"
                required
                autocomplete="username"
            >

            <label>Şifre</label>
            <input
                type="password"
                name="password"
                required
                autocomplete="current-password"
            >

            <button type="submit">Giriş Yap</button>
        </form>

        <div class="link">
            Hesabınız yok mu?
            <a href="/register">Üye Ol</a>
        </div>
    </div>
</body>
</html>
