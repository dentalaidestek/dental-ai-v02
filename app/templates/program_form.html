{% extends "base.html" %}
{% block content %}
<div class="program-form-page">
    <div class="program-form-header">
        <a class="workspace-back-link" href="/program">← Programım</a>
        <h1>{% if mode == 'edit' %}Programı Düzenle{% else %}Programa Ekle{% endif %}</h1>
        <p>Tarih, saat ve hatırlatmayı seçmeniz yeterli.</p>
    </div>

    {% if error %}<div class="workspace-flash error">{{ error }}</div>{% endif %}

    <form class="program-form-card" method="post" action="{% if mode == 'edit' %}/program/{{ event.id }}/edit{% else %}/program/new{% endif %}">
        <div class="program-form-grid">
            <label class="program-field">
                <span>Tür</span>
                <select name="event_type" id="programEventType" required>
                    {% for value, label in event_types.items() %}
                    <option value="{{ value }}" {% if initial_type == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </label>

            <label class="program-field program-field-wide">
                <span>Başlık</span>
                <input type="text" name="title" value="{{ initial_title or '' }}" maxlength="160" required placeholder="Örn. Kontrol randevusu">
            </label>

            <label class="program-field">
                <span>Başlangıç</span>
                <input type="datetime-local" name="start_at" value="{{ initial_start or '' }}" required>
            </label>

            <label class="program-field">
                <span>Bitiş <small>(isteğe bağlı)</small></span>
                <input type="datetime-local" name="end_at" value="{{ initial_end or '' }}">
            </label>

            <label class="program-field program-field-wide" id="programPatientField">
                <span>Hasta <small>(isteğe bağlı)</small></span>
                <select name="patient_id" data-patient-select>
                    <option value="">Hasta seçme</option>
                    {% for patient in patients %}
                    <option value="{{ patient.id }}" data-patient-id="{{ patient.id }}" {% if initial_patient_id|string == patient.id|string %}selected{% endif %}>{{ patient.first_name or '' }} {{ patient.last_name or '' }}</option>
                    {% endfor %}
                </select>
            </label>

            <label class="program-field program-field-wide">
                <span>Hatırlat</span>
                <select name="reminder_minutes" id="programReminder">
                    <option value="NONE" {% if initial_reminder == 'NONE' or initial_notification is defined and not initial_notification %}selected{% endif %}>Hatırlatma yok</option>
                    <option value="0" {% if initial_reminder == '0' and initial_notification %}selected{% endif %}>Saatinde</option>
                    <option value="15" {% if initial_reminder == '15' and initial_notification %}selected{% endif %}>15 dk önce</option>
                    <option value="30" {% if (initial_reminder == '30' or not initial_reminder) and (initial_notification is not defined or initial_notification) %}selected{% endif %}>30 dk önce</option>
                    <option value="60" {% if initial_reminder == '60' and initial_notification %}selected{% endif %}>1 saat önce</option>
                    <option value="120" {% if initial_reminder == '120' and initial_notification %}selected{% endif %}>2 saat önce</option>
                    <option value="1440" {% if initial_reminder == '1440' and initial_notification %}selected{% endif %}>1 gün önce</option>
                </select>
                <small class="program-reminder-hint">Hatırlatmaların size ulaşabilmesi için cihazınızda Dental AI bildirimlerini açık tutun.</small>
            </label>
        </div>

        <details class="program-more-options" {% if initial_location or initial_notes or initial_recurrence == 'WEEKLY' or initial_recurrence_until %}open{% endif %}>
            <summary>Diğer seçenekler</summary>
            <div class="program-form-grid">
                <label class="program-field">
                    <span>Konum</span>
                    <input type="text" name="location" value="{{ initial_location or '' }}" maxlength="160" placeholder="Klinik, derslik veya konum">
                </label>

                <label class="program-field">
                    <span>Tekrar</span>
                    <select name="recurrence_rule" id="recurrenceRule" onchange="toggleRecurrenceEnd()">
                        <option value="NONE" {% if initial_recurrence != 'WEEKLY' %}selected{% endif %}>Tekrarlama</option>
                        <option value="WEEKLY" {% if initial_recurrence == 'WEEKLY' %}selected{% endif %}>Her hafta</option>
                    </select>
                </label>

                <label class="program-field" id="recurrenceUntilField">
                    <span>Tekrar bitiş tarihi <small>(isteğe bağlı)</small></span>
                    <input type="date" name="recurrence_until" value="{{ initial_recurrence_until or '' }}">
                </label>

                <label class="program-field program-field-wide">
                    <span>Not <small>(isteğe bağlı)</small></span>
                    <textarea name="notes" rows="3" maxlength="2000" placeholder="Kısa not...">{{ initial_notes or '' }}</textarea>
                </label>
            </div>
        </details>

        <div class="program-form-actions">
            <a class="btn workspace-btn-secondary" href="/program">Vazgeç</a>
            <button class="btn" type="submit">{% if mode == 'edit' %}Kaydet{% else %}Programa Ekle{% endif %}</button>
        </div>
    </form>
</div>
<script>
function toggleRecurrenceEnd() {
    const value = document.getElementById('recurrenceRule').value;
    const field = document.getElementById('recurrenceUntilField');
    field.style.display = value === 'WEEKLY' ? '' : 'none';
}
function syncProgramPatientField(clearWhenHidden = false) {
    const type = document.getElementById('programEventType').value;
    const field = document.getElementById('programPatientField');
    const select = field.querySelector('select[name="patient_id"]');
    const supportsPatient = ['APPOINTMENT', 'CLINIC'].includes(type);
    field.style.display = supportsPatient ? '' : 'none';
    if (!supportsPatient && clearWhenHidden && select) {
        select.value = '';
    }
}
document.getElementById('programEventType').addEventListener('change', () => syncProgramPatientField(true));
toggleRecurrenceEnd();
syncProgramPatientField();
</script>
{% endblock %}
