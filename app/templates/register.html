<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DENTAL-AI - Üye Ol</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px 15px;
        }

        .box {
            max-width: 420px;
            margin: 40px auto;
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccd3dd;
            border-radius: 9px;
            font-size: 16px;
        }

        select {
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccd3dd;
            border-radius: 9px;
            font-size: 16px;
            background: white;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .link {
            text-align: center;
            margin-top: 18px;
        }

        .legal-box {
            margin-top: 24px;
            padding: 16px;
            background: #f8fafc;
            border: 1px solid #dbe3ee;
            border-radius: 12px;
        }

        .legal-check {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 0;
            margin-bottom: 14px;
            font-weight: 400;
            font-size: 14px;
            line-height: 1.5;
        }

        .legal-check input[type="checkbox"] {
            width: 18px;
            height: 18px;
            min-width: 18px;
            margin: 2px 0 0 0;
        }

        .legal-check span {
            flex: 1;
        }

        .legal-check a,
        .privacy-note a {
            font-weight: 700;
        }

        .privacy-note {
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
        }

        a {
            color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🦷 DENTAL-AI</h1>
        <h2>Üye Ol</h2>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/register">
            <label>Ad Soyad</label>
            <input
                type="text"
                name="display_name"
                required
                autocomplete="name"
            >

            <label>E-posta</label>
            <input
                type="email"
                name="email"
                required
                autocomplete="email"
            >

            <label>Kullanıcı adı</label>
            <input
                type="text"
                name="username"
                required
                minlength="8"
                maxlength="50"
                autocomplete="username"
            >

            <label>Şifre</label>
            <input
                type="password"
                name="password"
                required
                minlength="8"
                autocomplete="new-password"
            >

            <label>Okuduğunuz Üniversite</label>
            <input
                type="text"
                name="university"
                required
                maxlength="200"
                autocomplete="organization"
            >

            <label>Mesleki Durum / Unvan</label>
            <select name="professional_title" id="professional_title" required onchange="toggleProfessionalFields()">
                <option value="">Seçiniz</option>
                <option value="Öğrenci">Öğrenci</option>
                <option value="Diş Hekimi">Diş Hekimi</option>
                <option value="Uzman Diş Hekimi">Uzman Diş Hekimi</option>
                <option value="Dr. Öğr. Üyesi">Dr. Öğr. Üyesi</option>
                <option value="Doç. Dr.">Doç. Dr.</option>
                <option value="Prof. Dr.">Prof. Dr.</option>
            </select>

            <div id="graduateFields" style="display:none;">
                <label>Mezuniyet Yılı</label>
                <input type="number" name="graduation_year" id="graduation_year" min="1950" max="2100" placeholder="Örn. 2026">

                <div id="specialtyBox" style="display:none;">
                    <label>Uzmanlık Alanı</label>
                    <input type="text" name="specialty" id="specialty" maxlength="200" placeholder="Örn. Endodonti">
                </div>
            </div>


        <div class="legal-box">
            <label class="legal-check">
                <input
                    type="checkbox"
                    name="accept_terms"
                    value="yes"
                    required
                >
                <span>
                    <a href="/legal/terms" target="_blank">
                        Üyelik ve Kullanım Koşulları
                    </a>'nı okudum ve kabul ediyorum.
                </span>
            </label>

            <label class="legal-check">
                <input
                    type="checkbox"
                    name="kvkk_informed"
                    value="yes"
                    required
                >
                <span>
                    <a href="/legal/kvkk" target="_blank">
                        KVKK Aydınlatma Metni
                    </a>'ni okudum ve kişisel verilerimin işlenmesi
                    hakkında bilgilendirildim.
                </span>
            </label>

            <label class="legal-check">
                <input
                    type="checkbox"
                    name="accept_clinical"
                    value="yes"
                    required
                >
                <span>
                    <a href="/legal/clinical" target="_blank">
                        Dental AI Klinik Kullanım ve Sorumluluk Koşulları
                    </a>'nı okudum ve kabul ediyorum.
                </span>
            </label>

            <div class="privacy-note">
                Kişisel verilerin korunmasına ilişkin ayrıntılar için
                <a href="/legal/privacy" target="_blank">
                    Gizlilik Politikası
                </a>'nı inceleyebilirsiniz.
            </div>
        </div>

        <button type="submit">Üye Ol</button>
        </form>

        <div class="link">
            Zaten hesabınız var mı?
            <a href="/login">Giriş Yap</a>
        </div>
    </div>
<script>
function toggleProfessionalFields() {
    const title = document.getElementById("professional_title").value;
    const graduateFields = document.getElementById("graduateFields");
    const year = document.getElementById("graduation_year");
    const specialtyBox = document.getElementById("specialtyBox");
    const specialty = document.getElementById("specialty");
    const specialistTitles = ["Uzman Diş Hekimi", "Dr. Öğr. Üyesi", "Doç. Dr.", "Prof. Dr."];

    if (!title || title === "Öğrenci") {
        graduateFields.style.display = "none";
        year.required = false;
        year.value = "";
        specialtyBox.style.display = "none";
        specialty.required = false;
        specialty.value = "";
        return;
    }

    graduateFields.style.display = "block";
    year.required = true;
    const needsSpecialty = specialistTitles.includes(title);
    specialtyBox.style.display = needsSpecialty ? "block" : "none";
    specialty.required = needsSpecialty;
    if (!needsSpecialty) specialty.value = "";
}
</script>
</body>
</html>
