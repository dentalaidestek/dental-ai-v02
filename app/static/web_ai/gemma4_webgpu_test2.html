<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemma 4 WebGPU Test 2</title>

<style>
body {
    font-family: Arial, sans-serif;
    background:#f4f7fb;
    padding:20px;
}
.box {
    max-width:800px;
    margin:auto;
    background:white;
    padding:24px;
    border-radius:16px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}
button {
    padding:12px 18px;
    border:0;
    border-radius:10px;
    margin:5px;
    font-weight:bold;
}
#load {
    background:#2563eb;
    color:white;
}
#test {
    background:#16a34a;
    color:white;
}
#status {
    margin:15px 0;
    padding:12px;
    background:#eef2ff;
    border-radius:10px;
}
textarea {
    width:100%;
    min-height:120px;
    box-sizing:border-box;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
}
pre {
    background:#111827;
    color:#e5e7eb;
    padding:15px;
    border-radius:10px;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="box">

<h1>🦷 Gemma 4 E2B — WebGPU</h1>

<div id="status">WebGPU kontrol ediliyor...</div>

<button id="load">Gemma 4'ü Yükle</button>

<button id="test" disabled>Test Et</button>

<br><br>

<textarea id="prompt">Sadece TEST yaz.</textarea>

<h3>Sonuç</h3>

<pre id="output">Henüz test yapılmadı.</pre>

</div>

<script type="module">

import {
    AutoProcessor,
    Gemma4ForConditionalGeneration
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.0";

const MODEL = "onnx-community/gemma-4-E2B-it-ONNX";

let processor = null;
let model = null;

const status = document.getElementById("status");
const output = document.getElementById("output");
const loadButton = document.getElementById("load");
const testButton = document.getElementById("test");

async function checkWebGPU() {

    if (!navigator.gpu) {
        status.textContent = "❌ WebGPU desteklenmiyor.";
        return false;
    }

    const adapter = await navigator.gpu.requestAdapter();

    if (!adapter) {
        status.textContent = "❌ WebGPU adapter bulunamadı.";
        return false;
    }

    status.textContent =
        "✅ WebGPU hazır. Gemma 4 yüklenebilir.";

    return true;
}

loadButton.onclick = async () => {

    loadButton.disabled = true;

    try {

        status.textContent =
            "⏳ Gemma 4 E2B yükleniyor... İlk yükleme çok uzun sürebilir.";

        processor =
            await AutoProcessor.from_pretrained(MODEL);

        status.textContent =
            "⏳ Model ağırlıkları WebGPU'ya yükleniyor...";

        model =
            await Gemma4ForConditionalGeneration.from_pretrained(
                MODEL,
                {
                    dtype: "q4f16",
                    device: "webgpu",

                    progress_callback: (info) => {

                        if (info.status === "progress") {

                            status.textContent =
                                "⏳ Gemma yükleniyor: " +
                                Math.round(info.progress) +
                                "%";
                        }

                    }
                }
            );

        status.textContent =
            "✅ Gemma 4 cihaz üzerinde hazır.";

        testButton.disabled = false;

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ Gemma yüklenemedi: " + error.message;

        output.textContent =
            error.stack || String(error);

        loadButton.disabled = false;
    }
};

testButton.onclick = async () => {

    if (!model || !processor) {
        return;
    }

    testButton.disabled = true;

    try {

        output.textContent =
            "⏳ Gemma cevap oluşturuyor...";

        const text =
            document.getElementById("prompt").value;

        const messages = [
            {
                role: "user",
                content: [
                    {
                        type: "text",
                        text: text
                    }
                ]
            }
        ];

        const prompt =
            processor.apply_chat_template(
                messages,
                {
                    enable_thinking: false,
                    add_generation_prompt: true
                }
            );

        const inputs =
            await processor(
                prompt,
                null,
                null,
                {
                    add_special_tokens: false
                }
            );

        const outputs =
            await model.generate({
                ...inputs,
                max_new_tokens: 30,
                do_sample: false
            });

        const decoded =
            processor.batch_decode(
                outputs.slice(
                    null,
                    [inputs.input_ids.dims.at(-1), null]
                ),
                {
                    skip_special_tokens: true
                }
            );

        output.textContent = decoded[0];

    } catch (error) {

        console.error(error);

        output.textContent =
            error.stack || String(error);

    } finally {

        testButton.disabled = false;
    }
};

checkWebGPU();

</script>

</body>
</html>
